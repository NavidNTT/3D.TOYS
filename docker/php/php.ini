; ---------------------------------------------------------------------------
;  Toy Store — PHP settings (mounted at conf.d/zz-toy-store.ini)
;  Values are duplicated in fpm-pool.conf via php_admin_value so that
;  FPM children cannot override the security-relevant ones at runtime.
; ---------------------------------------------------------------------------

[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; --- Uploads: 3D models (.glb / .gltf / .hdr) ------------------------------
; Keep nginx client_max_body_size >= upload_max_filesize.
upload_max_filesize = 64M
post_max_size = 66M
max_file_uploads = 20
upload_tmp_dir = /tmp

; --- Errors / logging (container-friendly) ---------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Timezone / locale -----------------------------------------------------
date.timezone = UTC
default_charset = UTF-8
mbstring.language = neutral

; --- Sessions (Redis handles the real store; these keep it tidy) -----------
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; --- Opcache ---------------------------------------------------------------
; validate_timestamps=1 is what makes live-editing work in development.
; For production set it to 0 and raise opcache.validate_timestamps=0.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; --- Filesystem perf (bind mounts on Docker Desktop are slow) --------------
realpath_cache_size = 4096k
realpath_cache_ttl = 600
