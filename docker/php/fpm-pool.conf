; ---------------------------------------------------------------------------
;  Toy Store — php-fpm pool override (conf.d files are read alphabetically,
;  so this loads AFTER the image's zz-docker.conf and wins).
; ---------------------------------------------------------------------------

[www]
listen = 0.0.0.0:9000

; Do NOT strip the container environment: Laravel reads configuration
; straight from the docker-compose environment block (and .env is only
; a fallback). Without this, `env('DB_HOST')` returns null inside FPM.
clear_env = no

; --- FastCGI ping: powers the docker healthcheck -------------------------
ping.path = /ping
ping.response = pong

; --- Logging straight to the container log stream ------------------------
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}MkB %C%%"

; --- Process manager ------------------------------------------------------
; dynamic fits the mixed workload: API requests + queue workers reading Redis.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /status

; 3D asset uploads are slow, give them room; also caps runaway requests.
request_terminate_timeout = 300s

; --- Hard limits (cannot be relaxed by application code) -----------------
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 66M
php_admin_value[max_execution_time] = 120

; --- Environment the app is allowed to read ------------------------------
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[APP_URL] = $APP_URL
