# ---------------------------------------------------------------------------
#  Toy Store — Laravel reverse proxy
#  Mounted at /etc/nginx/conf.d/default.conf
# ---------------------------------------------------------------------------

# Docker's embedded DNS (127.0.0.11). Combined with resolving the upstream
# through a variable, nginx boots even when laravel.app is down or has a
# brand-new IP after `docker compose restart`.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # ── Upload limits ──────────────────────────────────────────────────────
    # 3D model uploads (.glb/.gltf) need generous room. 64M is the project
    # minimum for a single model; PHP is configured to match
    # (upload_max_filesize 64M / post_max_size 66M).
    # Need bigger models? raise this AND php.ini in lockstep.
    client_max_body_size 64M;
    client_body_buffer_size 256k;
    client_body_timeout 600s;

    # Long-running requests: asset transcoding, queue-triggered work, big uploads.
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 32k;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 75s;

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ── Health probe (used by the docker healthcheck) ──────────────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Never expose framework internals ───────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    location ~* \.(?:env|log|sqlite|ya?ml|ini|lock|sql|bak)$ {
        deny all;
    }

    # ── Application ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets, including the 3D formats served from public/ (the
    # canonical home for them is MinIO, this is the CDN-less fallback).
    #
    # Access-Control-Allow-Origin: the storefront is served from :3000 while
    # this—and the public disk behind /storage—answers on the API port, so
    # GLTFLoader's fetch() for a .glb is a cross-origin request. Laravel's CORS
    # middleware never runs for a file nginx returns itself, so without this
    # header the model silently fails to load with a console-only CORS error.
    # These are public storefront assets, so `*` is the honest policy.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|otf|glb|gltf|hdr|ktx2|basis|wasm)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri /index.php?$query_string;
    }

    # ── PHP-FPM ────────────────────────────────────────────────────────────
    location ~ [^/]\.php(/|$) {
        # Variable form forces runtime DNS resolution (see resolver above),
        # so a restarted laravel.app is picked up within 10s without an
        # nginx reload. `set` must live in this location.
        set $laravel_upstream "laravel.app:9000";

        fastcgi_pass $laravel_upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Scheme/port hints for Laravel's URL generator once a load
        # balancer or TLS terminator sits in front.
        fastcgi_param HTTPS           $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;

        fastcgi_intercept_errors off;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Denied paths ───────────────────────────────────────────────────────
    location ~ /vendor/.*\.php$ { deny all; }
    location ~ ^/(\.git|\.svn|\.hg|storage/framework|storage/logs) { deny all; }
}
